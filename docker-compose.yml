# ============================================
# AI Shorts Studio - Docker Compose
# ============================================
# Usage:
#   docker compose up bot          - Run Bot Server only
#   docker compose up worker       - Run AI Worker only
#   docker compose up              - Run both
# ============================================

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-shorts-studio-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./bot.db:/app/bot.db
    command: python bot/main.py
    networks:
      - ai-shorts-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-shorts-studio-worker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./temp:/app/temp
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: python worker/main.py
    # Uncomment for GPU support (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - ai-shorts-network

networks:
  ai-shorts-network:
    driver: bridge
