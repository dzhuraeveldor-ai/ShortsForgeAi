version: '3.8'

services:
  shortsforge-worker:
    build: .
    container_name: shortsforge-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-8000}:8000"
    volumes:
      - ./temp:/app/temp
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./models:/app/models
      - ./bot.db:/app/bot.db
    environment:
      - WORKER_ID=${WORKER_ID:-shortsforge_worker_01}
      - DATABASE_URL=sqlite:////app/bot.db
